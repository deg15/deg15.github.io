name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Generar sitio estático
        run: npm run build
        env:
          SITE_URL: https://deg15.github.io
          NEXT_TELEMETRY_DISABLED: '1'
      - run: npm run typecheck
      - name: Instalar navegador de pruebas
        run: npx playwright install --with-deps chromium
      - name: Comprobar el sitio exportado
        run: npm test
      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v5
